<!DOCTYPE html>
<html>
<head>
    <title>Ryan McKenzie</title>

    <style>
        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 30px auto;
            max-width: 1100px;
        }

        .large-image {
            width: 60%;
            height: auto;
        }

        .small-images {
            width: 35%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .small-images img {
            width: 100%;
            height: auto;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>

<body>

    <p><a href="https://ryan-mckenzie.github.io">Back</a></p>

    <center>
        <h2>Look deep, deep into nature, and then you will understand everything better.</h2>
    </center>

    <div class="image-container">

        <!-- Large image on the left -->
        <img src="TreeHugging.jpg" alt="Hugging a tree" class="large-image">

        <!-- Two smaller images on the right -->
        <div class="small-images">
            <img src="TreeHugging.jpg" alt="Nature image 2">
            <img src="TreeHugging.jpg" alt="Nature image 3">
        </div>

    </div>

</body>
</html>
