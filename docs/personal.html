the minimal replacement, retaining your 3×3 layout and large main image:
<!DOCTYPE html>
<html>
<head>
    <title>Ryan McKenzie</title>
    <style>
        body { margin: 10px; }

        .gallery {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            grid-template-rows: repeat(3, 22vh);
            gap: 10px;
            width: 76%;
            margin: 10px auto;
        }

        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .main {
            grid-column: 1 / 3;
            grid-row: 1 / 3;
        }
    </style>
</head>
<body>

<div class="gallery">
    <img class="main" src="Sea2Sky.jpg">
    <img src="TreeHugging.jpg">
    <img src="TreeHugging.jpg">
    <img src="TreeHugging.jpg">
    <img src="TreeHugging.jpg">
    <img src="TreeHugging.jpg">
</div>

</body>
</html>
