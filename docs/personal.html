<!DOCTYPE html>
<html>
<head>
    <title>Ryan McKenzie</title>

    <style>
        .gallery {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
            max-width: 1300px;
            margin: 30px auto;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .gallery img:first-child {
            grid-row: span 2;
            height: 410px;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>

<body>

    <p><a href="https://ryan-mckenzie.github.io">Back</a></p>

    <h2>Look deep, deep into nature, and then you will understand everything better.</h2>

    <div class="gallery">
        <img src="Sea2Sky.jpg" alt="Nature">
        <img src="TreeHugging.jpg" alt="Nature">
        <img src="TreeHugging.jpg" alt="Nature">
        <img src="TreeHugging.jpg" alt="Nature">
        <img src="TreeHugging.jpg" alt="Nature">
        <img src="TreeHugging.jpg" alt="Nature">
    </div>

</body>
</html>
